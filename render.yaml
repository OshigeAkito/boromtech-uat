# Render Blueprint: a UAT copy of the website for review before it goes to boromtech.com (production stays on
# Cloudflare, see apps/website/DEPLOY.md). It rebuilds on every push to the branch below. Every page is sent
# with noindex so search engines never list the UAT copy next to the real site.
services:
  - type: web
    name: boromtech-website-uat
    runtime: static
    branch: feature/ui-design
    buildCommand: npm ci && npm run website:build
    staticPublishPath: apps/website/dist
    buildFilter:
      paths:
        - apps/website/**
        - design-system/brand/**
        - package.json
        - package-lock.json
        - render.yaml
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
    envVars:
      - key: NODE_VERSION
        value: "24"
