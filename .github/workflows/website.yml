# Push to main → build the marketing site and deploy it to Cloudflare (apps/website/wrangler.toml).
#
# One switch, the GitHub variable MEDIA_ORIGIN (apps/website/DEPLOY.md):
#   unset                              deploy to boromtech-website.<account>.workers.dev, images inside the Worker.
#   https://media.boromtech.com        images go to R2 bt-public first (so no live page points at a missing image),
#                                      then deploy with --env production: the boromtech.com custom domain.
#
# GitHub secret:   CLOUDFLARE_API_TOKEN (Workers Scripts edit; for production also R2 write on bt-public,
#                  Workers Routes and DNS edit on the boromtech.com zone)
# GitHub variables: CLOUDFLARE_ACCOUNT_ID, MEDIA_ORIGIN (once boromtech.com and media.boromtech.com exist)
name: website
on:
  push:
    branches: [main]
    paths: ['apps/website/**', '.github/workflows/website.yml']
  workflow_dispatch:
concurrency: { group: deploy-website, cancel-in-progress: false }

jobs:
  website:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run: { working-directory: apps/website }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      MEDIA_ORIGIN: ${{ vars.MEDIA_ORIGIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: npm ci
        working-directory: .
      - run: npm run build
      - run: node scripts/check-copy.mjs
      - run: npm run upload-media # no-op without MEDIA_ORIGIN
      - run: npx wrangler deploy ${MEDIA_ORIGIN:+--env production}
