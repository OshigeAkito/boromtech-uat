# The marketing site at boromtech.co. One Worker serves the Astro build (dist/) as static assets (unmetered; the
# Worker code never runs for them), except for the paths in run_worker_first: the Thai root, where worker.mjs
# sends first-time visitors to their language before the page loads.
#
# Images are not in this upload. astro.config.mjs points built jpg/png/webp/avif at https://media.boromtech.co
# (R2 bucket bt-public), scripts/upload-media.mjs puts them there before each deploy, and public/.assetsignore
# keeps them out of dist's upload. JS, fonts and the video stay here, on the site's own origin.
name = "boromtech-website"
main = "worker.mjs"
compatibility_date = "2026-10-01"

routes = [{ pattern = "boromtech.co", custom_domain = true }]

[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = ["/"] # exact paths: "/" matches only the Thai root, not /en/ or /_astro/*

[observability]
enabled = true
